        <use href="#p-np" transform="translate(-292 -96) scale(.2)"/>
        <use href="#p-np" transform="translate(-196 104) scale(.24)"/>
        <use href="#p-np" transform="translate(-84 -120) scale(.15)"/>
        <use href="#p-np" transform="translate(126 116) scale(.16)"/>
        <use href="#p-np" transform="translate(212 -92) scale(.22)"/>
        <use href="#p-np" transform="translate(322 -38) scale(.26)"/>
        <use href="#p-np" transform="translate(300 106) scale(.2)"/>
