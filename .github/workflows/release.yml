name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      ZIP: importin-${{ github.ref_name }}-${{ matrix.target }}.zip
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: zip -j "$ZIP" "target/${{ matrix.target }}/release/importin" README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: importin-${{ matrix.target }}
          path: ${{ env.ZIP }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
