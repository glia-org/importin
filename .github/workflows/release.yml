name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: existing v* tag to build and release
        required: true
      runner:
        description: runner label (macos-latest is arm64; macos-15-intel when that pool is full)
        default: macos-latest

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One macOS runner builds both targets: a second job doubles the wait for a runner.
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
            zip -j "importin-$TAG-$target.zip" "target/$target/release/importin" README.md LICENSE
          done
      - uses: actions/upload-artifact@v4
        with:
          name: importin-zips
          path: importin-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: importin-zips
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.zip
